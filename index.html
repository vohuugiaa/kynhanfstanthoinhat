<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ĐÃ ĐỔI TIÊU ĐỀ VÀ GẮN LOGO TRÊN TRÌNH DUYỆT -->
  <title>FS TÂN THỚI NHẤT</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-header { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35); }
    .card-animate { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .loader { border: 3px solid #e2e8f0; border-top: 3px solid #dc2626; border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .rank-1 { background: linear-gradient(135deg, #F6D365 0%, #FDA085 100%); color: white; box-shadow: 0 4px 10px rgba(253,160,133,0.4); border: 2px solid #fff; }
    .rank-2 { background: linear-gradient(135deg, #E2E2E2 0%, #9B9B9B 100%); color: white; border: 2px solid #fff; }
    .rank-3 { background: linear-gradient(135deg, #D4AF37 0%, #AA6C39 100%); color: white; border: 2px solid #fff; }
    .rank-other { background: #f1f5f9; color: #64748b; font-weight: 700; border: 1px solid #e2e8f0; }
    .driver-card { transition: all 0.2s; }
    .driver-card:active { transform: scale(0.98); }
  </style>
</head>
<body class="pb-10">
  <div class="glass-header text-white px-5 pt-6 pb-6 sticky top-0 z-50 rounded-b-3xl">
    <div class="flex justify-between items-center mb-5">
      <div class="flex items-center gap-3">
        <!-- ĐÃ ĐỔI ICON XE TẢI THÀNH LOGO BEST EXPRESS -->
        <div class="bg-white p-1 rounded-xl shadow-inner w-[38px] h-[38px] flex items-center justify-center overflow-hidden">
          <img src="logo.png" alt="Best Express" class="w-full h-full object-contain">
        </div>
        <div>
          <h1 class="text-[17px] font-extrabold tracking-wide uppercase text-white drop-shadow-md">FS TÂN THỚI NHẤT</h1>
          <p class="text-[11px] text-red-100 font-medium mt-0.5"><i class="fa-regular fa-clock mr-1"></i>Cập nhật: <span id="lb-update">--:--</span></p>
        </div>
      </div>
      
      <button onclick="syncRealtime()" id="btn-sync" class="bg-yellow-400 hover:bg-yellow-500 text-red-900 px-3.5 py-2 rounded-full text-[11px] font-black shadow-lg border-2 border-yellow-300 flex items-center gap-1.5 transition-all active:scale-95 uppercase">
        <i class="fa-solid fa-bolt text-red-700"></i> Cập Nhật
      </button>
    </div>
    
    <div class="bg-black/20 rounded-[20px] p-4 backdrop-blur-md border border-white/20 flex justify-between items-center shadow-inner">
      <div class="text-center w-1/3">
        <p class="text-[10px] text-red-100 uppercase font-bold tracking-wider mb-1">Tổng Giao</p>
        <p class="text-[22px] font-black drop-shadow-md" id="tong-giao">0</p>
      </div>
      <div class="w-px h-10 bg-white/25 rounded-full"></div>
      <div class="text-center w-1/3">
        <p class="text-[10px] text-red-100 uppercase font-bold tracking-wider mb-1">Ký Nhận</p>
        <p class="text-[22px] font-black drop-shadow-md" id="tong-ky">0</p>
      </div>
      <div class="w-px h-10 bg-white/25 rounded-full"></div>
      <div class="text-center w-1/3">
        <p class="text-[10px] text-red-100 uppercase font-bold tracking-wider mb-1">Tỷ Lệ Trạm</p>
        <p class="text-[22px] font-black text-yellow-300 drop-shadow-md" id="tong-tyle">0%</p>
      </div>
    </div>
  </div>

  <div class="px-4 mt-6">
    <div class="bg-white rounded-[20px] p-4 mb-5 shadow-sm border border-gray-100 flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-[120px]">
        <label class="text-[10.5px] font-black text-gray-500 uppercase mb-1.5 block tracking-wider"><i class="fa-regular fa-calendar mr-1"></i> Từ ngày</label>
        <input type="date" id="start-date" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-[13px] rounded-xl focus:ring-red-500 focus:border-red-500 block p-2 font-bold shadow-inner outline-none transition-all">
      </div>
      <div class="flex-1 min-w-[120px]">
        <label class="text-[10.5px] font-black text-gray-500 uppercase mb-1.5 block tracking-wider"><i class="fa-regular fa-calendar-check mr-1"></i> Đến ngày</label>
        <input type="date" id="end-date" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-[13px] rounded-xl focus:ring-red-500 focus:border-red-500 block p-2 font-bold shadow-inner outline-none transition-all">
      </div>
      <button onclick="filterByDate()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 rounded-xl shadow-md shadow-red-500/30 transition-all active:scale-95 h-[38px] flex items-center justify-center">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="flex flex-col gap-3 mb-4 px-1">
      <div class="flex justify-between items-center">
        <h2 class="text-[16px] font-black text-gray-800 uppercase tracking-wide flex items-center">
          <i class="fa-solid fa-ranking-star text-yellow-500 mr-2 text-xl drop-shadow-sm"></i> Bảng Xếp Hạng
        </h2>
        <p class="text-[10px] font-bold text-gray-600 bg-gray-200 px-2 py-1.5 rounded-lg shadow-inner border border-gray-300" id="lb-date">--/--/----</p>
      </div>
      
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
        </div>
        <input type="text" id="search-driver" onkeyup="searchDriver()" placeholder="Nhập tên tài xế để tìm nhanh..." class="w-full bg-white border border-gray-200 text-gray-800 text-[13px] rounded-xl pl-10 pr-4 py-2.5 font-bold shadow-sm outline-none focus:ring-2 focus:ring-red-100 focus:border-red-400 transition-all">
      </div>
    </div>

    <div id="loading" class="flex flex-col items-center justify-center py-20">
      <div class="loader mb-4 shadow-sm"></div>
      <p class="text-sm text-gray-500 font-bold animate-pulse">Đang tải dữ liệu...</p>
    </div>

    <div id="driver-list" class="space-y-4 hidden pb-10"></div>
  </div>

  <script>
    // API TỪ GOOGLE SCRIPT MÀ BẠN VỪA CẬP NHẬT (NHỚ BẤM DEPLOY BÊN ĐÓ NHÉ)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-K7lvYQBRXSRPqNNX2UF6Sbv3VsCKsVHNasoZdGnqOGcIWdS3spI0T_DK9Ugn9ti9Ag/exec';

    window.onload = loadData;

    function searchDriver() {
       let input = document.getElementById('search-driver').value.toLowerCase();
       let cards = document.getElementsByClassName('driver-card');
       for(let i = 0; i < cards.length; i++) {
          let nameObj = cards[i].querySelector('h3');
          if(nameObj) {
             let name = nameObj.innerText.toLowerCase();
             cards[i].style.display = (name.indexOf(input) > -1) ? "" : "none";
          }
       }
    }

    function filterByDate() {
       let s = document.getElementById('start-date').value;
       let e = document.getElementById('end-date').value;
       if(s && e && s > e) { Swal.fire({ icon: 'error', title: 'Lỗi', text: 'Từ ngày không được lớn hơn Đến ngày!' }); return; }
       
       document.getElementById('loading').classList.remove('hidden');
       document.getElementById('driver-list').classList.add('hidden');
       
       if (s && e) {
           let diff = (new Date(e) - new Date(s)) / (1000 * 60 * 60 * 24);
           if (diff >= 2) {
               Swal.fire({
                   title: 'Đang kiểm tra dữ liệu...',
                   html: '<b style="color:#b20a2c">Nếu có ngày nào bị thiếu, hệ thống sẽ tự động kéo bù vào kho!</b><br><br><span style="font-size:12px; color:gray">(Quá trình kéo bù Auto có thể mất từ 1-4 phút. Vui lòng để máy chạy)</span>',
                   allowOutsideClick: false,
                   didOpen: () => { Swal.showLoading(); }
               });
           }
       }
       loadData();
    }

    function syncRealtime() {
        Swal.fire({
            title: 'Đang kéo dữ liệu Hôm Nay', 
            html: '<b style="color:#b20a2c">Đang kết nối máy chủ Best Express...</b><br><br><span style="font-size:12px; color:gray">(Có thể mất 15-90 giây)</span>',
            allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }
        });
        
        let url = `${SCRIPT_URL}?api=true&action=forceSync`;
        
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({ icon: 'success', title: 'Thành công!', text: 'Đã cập nhật dữ liệu mới nhất!', timer: 2000, showConfirmButton: false });
                    document.getElementById('start-date').value = data.date;
                    document.getElementById('end-date').value = data.date;
                    loadData();
                } else {
                    Swal.fire({ icon: 'error', title: 'Lỗi Đồng Bộ', text: data.message });
                }
            })
            .catch(err => Swal.fire({ icon: 'error', title: 'Lỗi Mạng', text: 'Mất kết nối với máy chủ!' }));
    }

    function toggleDetails(idx) {
      let el = document.getElementById('details-' + idx);
      let arrow = document.getElementById('arrow-' + idx);
      if(el.classList.contains('hidden')) {
         el.classList.remove('hidden');
         arrow.style.transform = 'rotate(180deg)';
      } else {
         el.classList.add('hidden');
         arrow.style.transform = 'rotate(0deg)';
      }
    }

    function loadData() {
      let sDate = document.getElementById('start-date').value || "";
      let eDate = document.getElementById('end-date').value || "";
      
      let url = `${SCRIPT_URL}?api=true&action=layDuLieu&start=${sDate}&end=${eDate}`;
      
      fetch(url)
        .then(res => res.json())
        .then(data => renderData(data))
        .catch(err => {
             document.getElementById('loading').classList.add('hidden');
             document.getElementById('driver-list').classList.remove('hidden');
             document.getElementById('driver-list').innerHTML = `<div class="bg-red-50 text-red-700 p-5 rounded-2xl font-bold border-2 border-red-200">Lỗi mạng hoặc chưa Triển Khai (Deploy) bản mới bên Google Script!</div>`;
        });
    }

    function renderData(data) {
      Swal.close(); 
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('driver-list').classList.remove('hidden');
      
      let searchBox = document.getElementById('search-driver');
      if (searchBox) searchBox.value = '';
      
      if (data && data.isDebug) {
        document.getElementById('tong-giao').innerText = "0";
        document.getElementById('tong-ky').innerText = "0";
        document.getElementById('tong-tyle').innerText = "0%";
        
        let now = new Date();
        let dd = String(now.getDate()).padStart(2, '0');
        let mm = String(now.getMonth() + 1).padStart(2, '0');
        let yyyy = now.getFullYear();
        let hh = String(now.getHours()).padStart(2, '0');
        let min = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('lb-update').innerText = `${dd}/${mm}/${yyyy} ${hh}:${min}`;
        
        if (data.emptyButSetDate) {
            document.getElementById('start-date').value = data.startDateStr;
            document.getElementById('end-date').value = data.endDateStr;
            let sStr = data.startDateStr.split('-').reverse().join('/');
            let eStr = data.endDateStr.split('-').reverse().join('/');
            document.getElementById('lb-date').innerText = (sStr === eStr) ? sStr : `${sStr} - ${eStr}`;
        }
        
        document.getElementById('driver-list').innerHTML = `<div class="bg-red-50 text-red-700 p-5 rounded-2xl font-bold border-2 border-red-200 shadow-sm"><i class="fa-solid fa-triangle-exclamation mr-2"></i> ${data.message}</div>`;
        return;
      }

      document.getElementById('start-date').value = data.startDateStr;
      document.getElementById('end-date').value = data.endDateStr;
      
      let sStr = data.startDateStr.split('-').reverse().join('/');
      let eStr = data.endDateStr.split('-').reverse().join('/');
      document.getElementById('lb-date').innerText = (sStr === eStr) ? sStr : `${sStr} - ${eStr}`;
      document.getElementById('lb-update').innerText = data.list[0].capnhat;

      let tongGiao = 0, tongKy = 0; let html = '';
      
      data.list.forEach((d, index) => {
        tongGiao += parseInt(d.tong); tongKy += parseInt(d.ky);
        let isPass = parseFloat(d.tyle) >= 85;
        let rankClass = index === 0 ? "rank-1" : (index === 1 ? "rank-2" : (index === 2 ? "rank-3" : "rank-other"));
        let rankIcon = index === 0 ? '<i class="fa-solid fa-crown text-[16px] drop-shadow-md"></i>' : index + 1;
        let tien = parseInt(d.tien);
        let tienStr = tien > 0 ? "+" + tien.toLocaleString('vi-VN') : tien.toLocaleString('vi-VN');
        let badgeColor = isPass ? "bg-emerald-100 text-emerald-700 border border-emerald-300" : "bg-rose-100 text-rose-700 border border-rose-300";
        let progressBg = isPass ? "bg-gradient-to-r from-emerald-400 to-emerald-600" : "bg-gradient-to-r from-rose-400 to-rose-600";
        let titleColor = isPass ? "text-emerald-600" : "text-rose-600";
        let delay = index * 0.08; 
        
        let doLech = parseInt(d.ky) - (parseInt(d.tong) * 0.85);
        let donStr = doLech > 0 ? `(Vượt ${doLech.toFixed(1)} đơn)` : (doLech < 0 ? `(Bị trừ ${Math.abs(doLech).toFixed(1)} đơn)` : `(Đạt chuẩn)`);

        html += `
          <div class="bg-white rounded-[20px] shadow-sm border border-gray-200 p-4 card-animate driver-card cursor-pointer hover:shadow-md" style="animation-delay: ${delay}s" onclick="toggleDetails(${index})">
            <div class="flex items-center gap-4 mb-4">
              <div class="w-[46px] h-[46px] rounded-[14px] flex items-center justify-center flex-shrink-0 ${rankClass} text-xl shadow-inner">
                ${rankIcon}
              </div>
              <div class="flex-1">
                <h3 class="font-black text-gray-800 text-[15px] leading-tight mb-1.5 uppercase tracking-tight">${d.name}</h3>
                <div class="flex text-[11px] font-bold text-gray-600 gap-1.5">
                  <span class="bg-gray-100 px-2 py-1 rounded-md border border-gray-200">Giao: <span class="text-gray-800">${d.tong}</span></span>
                  <span class="bg-emerald-50 px-2 py-1 rounded-md text-emerald-700 border border-emerald-100">Ký: ${d.ky}</span>
                  <span class="bg-rose-50 px-2 py-1 rounded-md text-rose-700 border border-rose-100">Rớt: ${d.rot}</span>
                </div>
              </div>
              <div class="text-right flex flex-col items-end">
                <p class="text-[24px] font-black ${titleColor} tracking-tighter drop-shadow-sm">${d.tyle}%</p>
                <i id="arrow-${index}" class="fa-solid fa-chevron-down text-gray-300 text-xs mt-1 transition-transform duration-300"></i>
              </div>
            </div>
            
            <div class="w-full bg-gray-100 rounded-full h-[8px] mb-4 overflow-hidden shadow-inner">
              <div class="${progressBg} h-[8px] rounded-full transition-all duration-[1500ms] ease-out shadow-sm" style="width: ${d.tyle}%"></div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-dashed border-gray-200">
              <div class="text-[12px] font-bold text-gray-500 flex flex-col justify-center">
                <div class="flex items-center">
                   ${isPass ? '<i class="fa-solid fa-circle-check text-emerald-500 mr-1.5 text-[15px]"></i> Thưởng' : '<i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1.5 text-[15px]"></i> Phạt'}
                   <span class="ml-1.5 font-bold ${isPass ? 'text-emerald-600' : 'text-rose-600'}">${donStr}</span>
                </div>
              </div>
              <div class="text-[14px] font-black px-3 py-1.5 rounded-xl ${badgeColor} shadow-sm">
                ${tienStr} ₫
              </div>
            </div>

            <div id="details-${index}" class="hidden mt-4 pt-4 border-t border-gray-200 transition-all" onclick="event.stopPropagation();">
               <h4 class="text-[10px] font-black text-gray-400 mb-2.5 uppercase tracking-widest"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Chi tiết từng ngày</h4>
               <div class="space-y-2">
                 ${d.days.map(day => {
                   let dl = parseInt(day.ky) - (parseInt(day.tong) * 0.85);
                   let dayDonStr = dl > 0 ? `VƯỢT ${dl.toFixed(1)} ĐƠN` : (dl < 0 ? `TRỪ ${Math.abs(dl).toFixed(1)} ĐƠN` : 'ĐẠT CHUẨN');
                   
                   return `
                   <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl text-[11.5px] font-bold border border-gray-100 shadow-inner">
                     <span class="text-gray-600 w-[75px]">${day.date.split('-').reverse().join('/')}</span>
                     <span class="text-gray-500 flex-1 text-center bg-white px-2 py-1 rounded-md border border-gray-200 shadow-sm mx-1">
                        Giao: <span class="text-gray-800">${day.tong}</span> <span class="text-gray-300 mx-0.5">|</span> Ký: <span class="text-emerald-600">${day.ky}</span>
                     </span>
                     <div class="flex flex-col text-right w-[80px]">
                         <span class="${day.tien > 0 ? 'textemerald-600' : (day.tien < 0 ? 'text-rose-600' : 'text-gray-500')} bg-white px-2 py-1 rounded-md border ${day.tien > 0 ? 'border-emerald-200' : (day.tien < 0 ? 'border-rose-200' : 'border-gray-200')} shadow-sm mb-1 leading-none">
                           ${day.tien > 0 ? '+' : ''}${day.tien.toLocaleString('vi-VN')} ₫
                         </span>
                         <span class="text-[8px] font-black ${day.tien > 0 ? 'text-emerald-500' : (day.tien < 0 ? 'text-rose-500' : 'text-gray-400')} uppercase text-center truncate mt-0.5">
                            ${dayDonStr}
                         </span>
                     </div>
                   </div>
                 `}).join('')}
               </div>
            </div>
          </div>
        `;
      });

      document.getElementById('tong-giao').innerText = tongGiao.toLocaleString('vi-VN');
      document.getElementById('tong-ky').innerText = tongKy.toLocaleString('vi-VN');
      let tongTyLe = tongGiao > 0 ? ((tongKy / tongGiao) * 100).toFixed(1) : 0;
      document.getElementById('tong-tyle').innerText = tongTyLe + "%";
      document.getElementById('driver-list').innerHTML = html;
    }
  </script>
</body>
</html>
